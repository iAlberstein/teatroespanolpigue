server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
    ssl_certificate_key /etc/letsencrypt/live/www.teatropigue.com.ar-0001/privkey.pem; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.teatropigue.com.ar-0001/fullchain.pem; # managed by Certbot
  server_name www.teatropigue.com.ar teatropigue.com.ar;
  root /home/teatropigue/htdocs/www.teatropigue.com.ar;

  access_log /home/teatropigue/logs/nginx/access.log main;
  error_log /home/teatropigue/logs/nginx/error.log;

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:4001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Bot prerendering for /cartelera (serves full HTML with JSON-LD to crawlers)
  location = /cartelera {
    if ($http_user_agent ~* "(googlebot|bingbot|yandexbot|duckduckbot|slurp|facebook|ia_archiver|semrushbot|ahrefsbot|chatgpt|gptbot|claude|anthropic|oai-searchbot|petalbot|bytespider|applebot)") {
      rewrite ^ /api/seo/bot-cartelera last;
    }
    try_files $uri $uri/ /index.html;
  }

  # Bot prerendering for individual show pages
  location ~ ^/cartelera/(.+)$ {
    if ($http_user_agent ~* "(googlebot|bingbot|yandexbot|duckduckbot|slurp|facebook|ia_archiver|semrushbot|ahrefsbot|chatgpt|gptbot|claude|anthropic|oai-searchbot|petalbot|bytespider|applebot)") {
      rewrite ^/cartelera/(.+)$ /api/seo/prerender/$1 last;
    }
    try_files $uri $uri/ /index.html;
  }

  # Anti-cache headers for SEO bot endpoints
  location ~ ^/api/seo/(bot-cartelera|prerender|sitemap) {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Updated "2026-06-02T18:00:00" always;
  }

  include /etc/nginx/global_settings;

  location / {
    if ($scheme != "https") {
      return 301 https://$host$request_uri;
    }
    if ($host != "www.teatropigue.com.ar") {
      return 301 https://www.teatropigue.com.ar$request_uri;
    }
    try_files $uri $uri/ /index.html;
  }


}
